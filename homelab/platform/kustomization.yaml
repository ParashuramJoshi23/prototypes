apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared backing stores for the homelab. Apply with:
#   kubectl apply -k homelab/platform
#
# elasticsearch.yaml is intentionally NOT listed — it's a drop-in for later
# (uncomment the line below once mini B is online and labelled tenant=b).
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - localstack.yaml
  # - elasticsearch.yaml
