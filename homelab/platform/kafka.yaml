# Shared Kafka — one single-node KRaft cluster (no ZooKeeper).
# Isolation is per-project via topic-name prefix: <project>.<topic>
#   e.g. hashtag.post.created, video.transcode.requested
#
# DNS for clients: kafka.platform.svc.cluster.local:9092
#
# Placement note: Kafka is a ~1GB JVM tenant. The design doc says keep the two
# JVM tenants (Kafka + Elasticsearch) on SEPARATE minis. While mini B is offline
# we pin Kafka to A. When B joins and ES is added, ES goes to B (tenant=b) and
# this affinity can be flipped to "b" + the StatefulSet recreated (homelab data
# is throwaway, so losing the local-path volume on the move is acceptable).
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: platform
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: platform
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.tenant
                    operator: In
                    values: ["a"]
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
          env:
            # ── KRaft single-node (combined broker+controller) ──
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              # Must be the cluster-internal DNS name so other pods can reach it.
              value: "PLAINTEXT://kafka.platform.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # ── single-node replication factors ──
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # ── pin the JVM heap so it can't autosize and over-grab RAM ──
            - name: KAFKA_HEAP_OPTS
              value: "-Xms1g -Xmx1g"
            # Stable cluster id so the KRaft metadata log survives restarts.
            - name: CLUSTER_ID
              value: "homelab-kafka-cluster-0001"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
