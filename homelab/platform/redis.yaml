# Shared Redis — one instance for the whole cluster.
# Isolation is per-project via logical DB index (0-15), tracked in registry.md.
# Split a project onto a dedicated instance only if it needs a different
# eviction policy (e.g. allkeys-lru cache vs. a durable store) — those conflict
# at the instance level.
#
# DNS for clients: redis.platform.svc.cluster.local:6379  (pick your db index)
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: platform
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.tenant
                    operator: In
                    values: ["a"]
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            # maxmemory guard so a misbehaving project can't starve the node.
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "noeviction"
            - "--appendonly"
            - "yes"
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "320Mi"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
