# Shared Elasticsearch — NOT DEPLOYED YET. Drop-in for when a project needs
# search. To enable: add "- elasticsearch.yaml" to kustomization.yaml AND make
# sure mini B is online and labelled tenant=b (keeps the two JVM tenants —
# Kafka and ES — on separate minis, per the design doc).
#
# Isolation is per-project via index-per-project (e.g. <project>-* indices).
# DNS for clients: http://elasticsearch.platform.svc.cluster.local:9200
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: platform
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: platform
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.tenant
                    operator: In
                    # mini B — keep ES off the same node as Kafka.
                    values: ["b"]
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            # Pin heap — ES autosizes to a fraction of *detected* RAM and may see
            # the full 16GB inside OrbStack and over-grab. (design doc gotcha)
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          resources:
            requests:
              memory: "1536Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
