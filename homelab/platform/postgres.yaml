# Shared PostgreSQL — one server for the whole cluster.
# Isolation is per-project: each project gets its own DATABASE + role
# (see homelab/scripts/bootstrap-project.sh). Never share schemas across projects.
#
# DNS for clients: postgres.platform.svc.cluster.local:5432
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: platform
type: Opaque
stringData:
  # Superuser used only by bootstrap-project.sh to CREATE DATABASE/ROLE.
  # Per-project apps never use this; they get their own scoped role.
  POSTGRES_PASSWORD: "change-me-postgres"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Pin the data layer to mini A. local-path PVC ties the data to this node's
      # disk, so the pod must always schedule here.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.tenant
                    operator: In
                    values: ["a"]
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
