# n8n config (regular mode — single instance, no queue/workers, no Redis).
# Sensitive values (DB password, N8N_ENCRYPTION_KEY) live in the Secret
# 'n8n-secrets', created by hand from the bootstrap-generated DB password.
# n8n reads discrete DB_* vars (not a DATABASE_URL), hence its own ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  # ── database: shared Postgres, n8n's own db ──
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres.platform.svc.cluster.local"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "n8n_user"

  # ── server ──
  # Exposed on the tailnet via `tailscale serve` (HTTPS) -> NodePort 30678.
  # n8n listens plain http on 5678 inside the pod; Tailscale terminates TLS.
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  N8N_HOST: "homelab-a.tailbe4cd1.ts.net"
  # Now behind real HTTPS (tailnet), so secure cookies are back on.
  N8N_SECURE_COOKIE: "true"
  # Editor + webhook base URL = the tailnet HTTPS URL. Reachable from any device
  # on the tailnet; `tailscale funnel` would extend this to public webhooks.
  WEBHOOK_URL: "https://homelab-a.tailbe4cd1.ts.net/"

  # ── misc ──
  GENERIC_TIMEZONE: "Asia/Kolkata"
  TZ: "Asia/Kolkata"
  # Use the modern internal task runner (recommended in n8n 2.x).
  N8N_RUNNERS_ENABLED: "true"
  # No telemetry from the homelab.
  N8N_DIAGNOSTICS_ENABLED: "false"
  # Binary data on local fs for now (ephemeral without a PVC — fine for regular
  # mode start; switch to LocalStack S3 later if you need durable binary data).
  N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
