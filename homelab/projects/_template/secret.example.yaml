# EXAMPLE ONLY — do not apply this directly and do not put real secrets here.
# The real Secret is created by scripts/bootstrap-project.sh with a generated
# DB password. This file documents the shape so deployment.yaml's envFrom is clear.
#
# To inspect the real one:  kubectl get secret PROJECT-secrets -n PROJECT -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: PROJECT-secrets
  namespace: PROJECT
type: Opaque
stringData:
  DATABASE_URL: "postgresql://PROJECT_user:GENERATED@postgres.platform.svc.cluster.local:5432/PROJECT"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
