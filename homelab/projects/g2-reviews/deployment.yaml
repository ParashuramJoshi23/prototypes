apiVersion: apps/v1
kind: Deployment
metadata:
  name: g2-reviews
  namespace: g2-reviews
spec:
  replicas: 1
  selector:
    matchLabels:
      app: g2-reviews
  template:
    metadata:
      labels:
        app: g2-reviews
    spec:
      containers:
        - name: app
          # Built from prototypes/g2-reviews/Dockerfile, imported into the VM's
          # containerd (see homelab/README.md "Validate"). Not pulled from a registry.
          image: g2-reviews:homelab
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: g2-reviews-config
            - secretRef:
                name: g2-reviews-secrets   # DATABASE_URL, created by bootstrap-project.sh
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: g2-reviews
  namespace: g2-reviews
spec:
  selector:
    app: g2-reviews
  ports:
    - name: http
      port: 8000
      targetPort: 8000
