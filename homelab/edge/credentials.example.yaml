# EXAMPLE ONLY — do not apply, do not commit real credentials.
# The real Secret is created by scripts/setup-tunnel.sh from the credentials.json
# that `cloudflared tunnel create` writes to ~/.cloudflared/<TUNNEL_UUID>.json.
# This file only documents the shape so cloudflared.yaml's volume mount is clear.
#
# Inspect the real one:  kubectl get secret cloudflared-credentials -n edge -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: edge
type: Opaque
stringData:
  # Exactly the contents of ~/.cloudflared/<TUNNEL_UUID>.json
  credentials.json: |
    {
      "AccountTag":   "REDACTED",
      "TunnelID":     "REDACTED-UUID",
      "TunnelName":   "homelab-demos",
      "TunnelSecret": "REDACTED-BASE64"
    }
