[project]
name = "jobqueue"
version = "0.1.0"
description = "A tiny Postgres-backed job queue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
jq = "jobqueue:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
