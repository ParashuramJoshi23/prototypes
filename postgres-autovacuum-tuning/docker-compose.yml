services:
  postgres:
    image: postgres:16
    container_name: pg_autovacuum_demo
    environment:
      POSTGRES_DB: autovacuum_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
    command: >
      postgres
        -c autovacuum=on
        -c autovacuum_naptime=5s
        -c autovacuum_vacuum_scale_factor=0.2
        -c autovacuum_vacuum_threshold=50
        -c autovacuum_analyze_scale_factor=0.1
        -c autovacuum_analyze_threshold=50
        -c log_autovacuum_min_duration=0
        -c log_min_messages=info
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
