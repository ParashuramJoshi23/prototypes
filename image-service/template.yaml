AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Image upload/storage service

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        S3_BUCKET: !Ref ImageBucket
        DYNAMODB_TABLE: !Ref ImageMetadataTable
        AWS_REGION: !Ref AWS::Region

Resources:

  # ── S3 ────────────────────────────────────────────────────────────────────
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-service-${AWS::AccountId}-${AWS::Region}"
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOrphanedObjects
            Status: Enabled
            # Objects without a matching DynamoDB record older than 1 day are cleaned up
            ExpirationInDays: 1
            Prefix: "images/"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # ── DynamoDB ──────────────────────────────────────────────────────────────
  ImageMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: image-service-metadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: image_id
          AttributeType: S
      KeySchema:
        - AttributeName: image_id
          KeyType: HASH

  # ── Lambda functions ──────────────────────────────────────────────────────
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/upload.handler
      Description: Upload an image with metadata
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageMetadataTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /images
            Method: POST
            RestApiId: !Ref ImageApi

  ListImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/list_images.handler
      Description: List images with optional filters
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImageMetadataTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /images
            Method: GET
            RestApiId: !Ref ImageApi

  GetImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/get_image.handler
      Description: Get image metadata and presigned download URL
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ImageMetadataTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /images/{image_id}
            Method: GET
            RestApiId: !Ref ImageApi

  DeleteImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/delete_image.handler
      Description: Delete an image and its metadata
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageMetadataTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /images/{image_id}
            Method: DELETE
            RestApiId: !Ref ImageApi

  # ── API Gateway ───────────────────────────────────────────────────────────
  ImageApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      BinaryMediaTypes:
        - "image/*"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ImageApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  BucketName:
    Value: !Ref ImageBucket
  TableName:
    Value: !Ref ImageMetadataTable
