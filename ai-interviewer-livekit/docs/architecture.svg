<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2f6fe0"/></marker>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/></marker>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d23b5b"/></marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e9e5b"/></marker>
  </defs>

  <rect width="1280" height="840" fill="#fbfcfe"/>
  <text x="40" y="46" font-size="27" font-weight="700" fill="#1b2233">AI Interviewer — Voice Survey System</text>
  <text x="40" y="70" font-size="14" fill="#6b7280">LiveKit Agents · Claude · Deepgram · Cartesia · FastAPI · Postgres</text>

  <!-- group backgrounds -->
  <rect x="22" y="300" width="408" height="452" rx="14" fill="#f1f8f3" stroke="#bfe3cc" stroke-dasharray="5 4"/>
  <text x="38" y="324" font-size="13" font-weight="700" fill="#2e9e5b">YOUR BACKEND</text>
  <rect x="1088" y="150" width="172" height="210" rx="14" fill="#fdf2f4" stroke="#f3cdd6" stroke-dasharray="5 4"/>
  <text x="1104" y="174" font-size="13" font-weight="700" fill="#d23b5b">EXTERNAL AI PROVIDERS</text>

  <!-- Browser -->
  <rect x="40" y="100" width="250" height="168" rx="12" fill="#e6efff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="60" y="128" font-size="16" font-weight="700" fill="#26417f">Browser client</text>
  <text x="60" y="147" font-size="12" fill="#41597f">web/index.html · LiveKit JS SDK</text>
  <text x="60" y="176" font-size="12.5" fill="#2b3a55">• microphone + speaker</text>
  <text x="60" y="197" font-size="12.5" fill="#2b3a55">• survey picker</text>
  <text x="60" y="218" font-size="12.5" fill="#2b3a55">• live transcript view</text>
  <text x="60" y="239" font-size="12.5" fill="#2b3a55">• results view</text>

  <!-- Token server -->
  <rect x="40" y="338" width="250" height="170" rx="12" fill="#e6f7ec" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="60" y="366" font-size="16" font-weight="700" fill="#1f6e41">Token Server</text>
  <text x="60" y="385" font-size="12" fill="#357a52">FastAPI · app/token_server.py</text>
  <text x="60" y="414" font-size="12.5" fill="#244" >GET  /api/surveys</text>
  <text x="60" y="435" font-size="12.5" fill="#244">POST /api/token</text>
  <text x="60" y="456" font-size="12.5" fill="#244">GET  /api/results/&lt;room&gt;</text>
  <text x="60" y="477" font-size="12.5" fill="#244">serves the web client</text>
  <text x="60" y="498" font-size="11.5" fill="#5a7" font-style="italic">mints JWT with survey_id in metadata</text>

  <!-- Surveys -->
  <rect x="40" y="588" width="150" height="120" rx="12" fill="#fff7e6" stroke="#caa23a" stroke-width="1.5"/>
  <text x="58" y="614" font-size="14" font-weight="700" fill="#8a6d1e">surveys/</text>
  <text x="58" y="635" font-size="12" fill="#7a6520">*.yaml</text>
  <text x="58" y="660" font-size="11.5" fill="#7a6520">questions,</text>
  <text x="58" y="677" font-size="11.5" fill="#7a6520">persona,</text>
  <text x="58" y="694" font-size="11.5" fill="#7a6520">closing line</text>

  <!-- Postgres -->
  <rect x="212" y="568" width="200" height="160" rx="12" fill="#eceef4" stroke="#5b6472" stroke-width="1.5"/>
  <text x="232" y="595" font-size="16" font-weight="700" fill="#39414f">Postgres</text>
  <text x="232" y="613" font-size="11.5" fill="#6b7280">docker-compose · asyncpg</text>
  <rect x="232" y="626" width="160" height="26" rx="6" fill="#fff" stroke="#9aa3b4"/>
  <text x="242" y="644" font-size="12" fill="#39414f">interviews</text>
  <rect x="232" y="658" width="160" height="26" rx="6" fill="#fff" stroke="#9aa3b4"/>
  <text x="242" y="676" font-size="12" fill="#39414f">answers  (structured)</text>
  <rect x="232" y="690" width="160" height="26" rx="6" fill="#fff" stroke="#9aa3b4"/>
  <text x="242" y="708" font-size="12" fill="#39414f">transcript  (verbatim)</text>

  <!-- LiveKit -->
  <rect x="470" y="312" width="206" height="180" rx="12" fill="#fdebd3" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="490" y="340" font-size="16" font-weight="700" fill="#a5630f">LiveKit Cloud</text>
  <text x="490" y="359" font-size="12" fill="#b06e15">realtime media (WebRTC)</text>
  <text x="490" y="388" font-size="12.5" fill="#5a3d12">• SFU audio routing</text>
  <text x="490" y="409" font-size="12.5" fill="#5a3d12">• room lifecycle</text>
  <text x="490" y="430" font-size="12.5" fill="#5a3d12">• agent dispatch</text>
  <text x="490" y="451" font-size="12.5" fill="#5a3d12">• verifies JWT</text>
  <text x="490" y="478" font-size="11.5" fill="#a5630f" font-style="italic">(or self-hosted)</text>

  <!-- Agent worker -->
  <rect x="720" y="108" width="338" height="486" rx="12" fill="#f0e8fb" stroke="#8a4fd1" stroke-width="1.6"/>
  <text x="740" y="136" font-size="16" font-weight="700" fill="#5e2fa3">Interviewer agent worker</text>
  <text x="740" y="155" font-size="12" fill="#6f48b0">LiveKit Agents · app/agent.py  (your process)</text>

  <rect x="740" y="170" width="298" height="34" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="754" y="192" font-size="12.5" fill="#4a2e7a">Silero VAD + multilingual turn detector</text>

  <!-- pipeline row -->
  <rect x="740" y="216" width="92" height="58" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="786" y="240" font-size="12.5" font-weight="700" fill="#4a2e7a" text-anchor="middle">STT</text>
  <text x="786" y="258" font-size="10.5" fill="#6f48b0" text-anchor="middle">Deepgram</text>

  <rect x="843" y="216" width="92" height="58" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="889" y="240" font-size="12.5" font-weight="700" fill="#4a2e7a" text-anchor="middle">LLM</text>
  <text x="889" y="258" font-size="10.5" fill="#6f48b0" text-anchor="middle">Claude</text>

  <rect x="946" y="216" width="92" height="58" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="992" y="240" font-size="12.5" font-weight="700" fill="#4a2e7a" text-anchor="middle">TTS</text>
  <text x="992" y="258" font-size="10.5" fill="#6f48b0" text-anchor="middle">Cartesia</text>

  <!-- pipeline arrows -->
  <line x1="832" y1="245" x2="841" y2="245" stroke="#8a4fd1" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="935" y1="245" x2="944" y2="245" stroke="#8a4fd1" stroke-width="1.6" marker-end="url(#aBlue)"/>

  <rect x="740" y="288" width="298" height="36" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="754" y="311" font-size="12" fill="#4a2e7a">InterviewAgent · system prompt from survey</text>

  <rect x="740" y="332" width="298" height="36" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="754" y="355" font-size="12" fill="#4a2e7a">tools: record_answer · complete_interview</text>

  <rect x="740" y="376" width="298" height="36" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="754" y="399" font-size="12" fill="#4a2e7a">event conversation_item_added → transcript</text>

  <rect x="740" y="420" width="298" height="36" rx="8" fill="#fff" stroke="#b79ae0"/>
  <text x="754" y="443" font-size="12" fill="#4a2e7a">loads survey by id  (survey.py)</text>

  <text x="740" y="478" font-size="11.5" fill="#5e2fa3" font-style="italic">reads survey_id from participant metadata,</text>
  <text x="740" y="494" font-size="11.5" fill="#5e2fa3" font-style="italic">writes session / answers / transcript to Postgres</text>

  <!-- Providers -->
  <rect x="1100" y="214" width="148" height="34" rx="8" fill="#fde6ea" stroke="#d23b5b" stroke-width="1.4"/>
  <text x="1174" y="236" font-size="12.5" fill="#9c2942" text-anchor="middle">Deepgram (STT)</text>
  <rect x="1100" y="256" width="148" height="34" rx="8" fill="#fde6ea" stroke="#d23b5b" stroke-width="1.4"/>
  <text x="1174" y="278" font-size="12.5" fill="#9c2942" text-anchor="middle">Anthropic — Claude</text>
  <rect x="1100" y="298" width="148" height="34" rx="8" fill="#fde6ea" stroke="#d23b5b" stroke-width="1.4"/>
  <text x="1174" y="320" font-size="12.5" fill="#9c2942" text-anchor="middle">Cartesia (TTS)</text>

  <!-- ===== arrows / flows ===== -->
  <!-- 1 browser->token (surveys) -->
  <line x1="120" y1="268" x2="120" y2="336" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <!-- 2 token->browser (token) -->
  <line x1="205" y1="336" x2="205" y2="270" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <circle cx="100" cy="302" r="11" fill="#3b6fd4"/><text x="100" y="306" font-size="12" fill="#fff" text-anchor="middle">1</text>
  <circle cx="225" cy="302" r="11" fill="#3b6fd4"/><text x="225" y="306" font-size="12" fill="#fff" text-anchor="middle">2</text>

  <!-- 3 browser<->livekit media -->
  <line x1="290" y1="178" x2="568" y2="312" stroke="#2f6fe0" stroke-width="2.4" marker-end="url(#aBlue)" marker-start="url(#aBlue)"/>
  <circle cx="430" cy="238" r="11" fill="#2f6fe0"/><text x="430" y="242" font-size="12" fill="#fff" text-anchor="middle">3</text>
  <text x="300" y="200" font-size="11.5" fill="#2f6fe0">WebRTC audio + transcript data</text>

  <!-- 4 livekit<->agent media + dispatch -->
  <line x1="676" y1="372" x2="718" y2="300" stroke="#2f6fe0" stroke-width="2.4" marker-end="url(#aBlue)" marker-start="url(#aBlue)"/>
  <circle cx="700" cy="332" r="11" fill="#2f6fe0"/><text x="700" y="336" font-size="12" fill="#fff" text-anchor="middle">4</text>
  <text x="606" y="300" font-size="11.5" fill="#2f6fe0">media + dispatch</text>

  <!-- 5 agent -> providers -->
  <line x1="832" y1="231" x2="1098" y2="231" stroke="#d23b5b" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#aRed)"/>
  <line x1="935" y1="245" x2="1098" y2="270" stroke="#d23b5b" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#aRed)"/>
  <line x1="1038" y1="252" x2="1098" y2="312" stroke="#d23b5b" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#aRed)"/>
  <circle cx="1070" cy="200" r="11" fill="#d23b5b"/><text x="1070" y="204" font-size="12" fill="#fff" text-anchor="middle">5</text>
  <text x="1058" y="188" font-size="11" fill="#d23b5b" text-anchor="end">HTTPS</text>

  <!-- 6 agent -> postgres (writes) -->
  <path d="M 800 594 L 800 770 L 312 770 L 312 730" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#aGreen)"/>
  <circle cx="560" cy="770" r="11" fill="#2e9e5b"/><text x="560" y="774" font-size="12" fill="#fff" text-anchor="middle">6</text>
  <text x="576" y="763" font-size="11.5" fill="#1f6e41">agent writes: start_session · record_answer · transcript · complete</text>

  <!-- 7 token <- postgres (reads) -->
  <path d="M 280 560 L 280 510" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#aGreen)"/>
  <circle cx="305" cy="536" r="11" fill="#2e9e5b"/><text x="305" y="540" font-size="12" fill="#fff" text-anchor="middle">7</text>
  <text x="322" y="540" font-size="11" fill="#1f6e41">reads for /api/results</text>

  <!-- 8 surveys -> token + surveys -> agent -->
  <line x1="115" y1="588" x2="115" y2="510" stroke="#caa23a" stroke-width="1.8" marker-end="url(#aGray)"/>
  <path d="M 190 628 L 690 628 L 690 438 L 738 438" fill="none" stroke="#caa23a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <circle cx="690" cy="540" r="11" fill="#caa23a"/><text x="690" y="544" font-size="12" fill="#fff" text-anchor="middle">8</text>
  <text x="700" y="544" font-size="11" fill="#8a6d1e">both processes read surveys/</text>

  <!-- Legend -->
  <rect x="446" y="520" width="250" height="150" rx="10" fill="#ffffff" stroke="#d4d9e2"/>
  <text x="462" y="544" font-size="13" font-weight="700" fill="#39414f">Legend</text>
  <line x1="462" y1="562" x2="500" y2="562" stroke="#2f6fe0" stroke-width="2.4"/><text x="508" y="566" font-size="11.5" fill="#39414f">realtime media (WebRTC)</text>
  <line x1="462" y1="584" x2="500" y2="584" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="508" y="588" font-size="11.5" fill="#39414f">HTTP / REST (browser ⇄ API)</text>
  <line x1="462" y1="606" x2="500" y2="606" stroke="#d23b5b" stroke-width="1.6" stroke-dasharray="2 3"/><text x="508" y="610" font-size="11.5" fill="#39414f">provider API (HTTPS)</text>
  <line x1="462" y1="628" x2="500" y2="628" stroke="#2e9e5b" stroke-width="2"/><text x="508" y="632" font-size="11.5" fill="#39414f">database read / write</text>
  <line x1="462" y1="650" x2="500" y2="650" stroke="#caa23a" stroke-width="1.8"/><text x="508" y="654" font-size="11.5" fill="#39414f">survey definitions load</text>

  <!-- voice loop caption -->
  <text x="722" y="612" font-size="11.5" fill="#5e2fa3" font-style="italic">Voice loop: participant speech → STT → Claude (survey prompt + tools) → TTS → participant</text>
</svg>
