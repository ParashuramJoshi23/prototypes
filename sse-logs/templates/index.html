<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deployment Logs</title>
</head>
<body>
  <h2>Deployment Logs</h2>

  <button onclick="newDeployment()">New Deployment</button>
  <p id="status"></p>
  <ul id="logs"></ul>

  <script>
    let es = null;

    async function newDeployment() {
      if (es) { es.close(); es = null; }

      document.getElementById("logs").innerHTML = "";
      document.getElementById("status").textContent = "Creating deployment…";

      const res  = await fetch("/deployments", { method: "POST" });
      const data = await res.json();

      document.getElementById("status").textContent =
        `${data.name}  (${data.id})  — running`;

      es = new EventSource(`/deployments/${data.id}/stream`);

      es.onmessage = (event) => {
        const li = document.createElement("li");
        li.textContent = event.data;
        document.getElementById("logs").prepend(li);
      };

      es.addEventListener("done", () => {
        es.close();
        es = null;
        document.getElementById("status").textContent =
          document.getElementById("status").textContent.replace("running", "complete");
      });
    }
  </script>
</body>
</html>
