<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployment Logs</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Deployments</span>
      <button id="newDeployBtn" class="new-btn">+ New</button>
    </div>
    <ul id="deployList" class="deploy-list">
      <!-- populated by JS -->
    </ul>
  </aside>

  <!-- ── Main panel ───────────────────────────────────────────── -->
  <main id="main">

    <!-- Toolbar -->
    <header class="log-header">
      <div class="log-title-row">
        <span id="deployName" class="deploy-name">—</span>
        <span id="deployId"   class="deploy-id"></span>
        <span id="statusBadge" class="badge badge--idle">idle</span>
      </div>
      <button id="clearBtn" class="clear-btn" title="Clear view">Clear</button>
    </header>

    <!-- Log output (newest line prepended = at the top) -->
    <div id="logPanel" class="log-panel">
      <div id="emptyHint" class="empty-hint">
        Press <strong>+ New</strong> to start a deployment and stream its logs.
      </div>
    </div>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
